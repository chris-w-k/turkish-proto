<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Escape Loop - Level 1: Ordering at the Cafe. A playable prototype. No dependencies.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Escape Loop Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#EDF1F4; --surface:#FBFCFD; --surface-2:#E3EAEF;
  --ink:#111A21; --ink-soft:#4C5D6A; --ink-faint:#7A8B98;
  --line:#CFDAE2; --line-soft:#DFE7EC;
  --ember:#C63F16; --jade:#0C7360;
  --shadow:0 1px 2px rgba(17,26,33,.06),0 18px 48px -24px rgba(17,26,33,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1418; --surface:#151D23; --surface-2:#1B252C;
  --ink:#E7EEF3; --ink-soft:#9CADB9; --ink-faint:#71828F;
  --line:#26323B; --line-soft:#1F2931; --ember:#FF7043; --jade:#3ABF9F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 20px 50px -26px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0E1418; --surface:#151D23; --surface-2:#1B252C;
  --ink:#E7EEF3; --ink-soft:#9CADB9; --ink-faint:#71828F;
  --line:#26323B; --line-soft:#1F2931; --ember:#FF7043; --jade:#3ABF9F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 20px 50px -26px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{
  background:var(--ground);color:var(--ink);
  font-family:"Literata",Georgia,serif;-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.dev{
  --panel:#FFF9EF; --panel-2:#F3E8D7; --panel-line:#DCCCB3;
  --txt:#2E2519; --txt-soft:#6B5C46; --tr:#1B5E7E; --ok:#1F8A5F; --no:#C4381C;
  width:100%;max-width:392px;height:min(660px,calc(100dvh - 32px));min-height:520px;
  border-radius:30px;overflow:hidden;position:relative;background:var(--panel);
  box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;flex-direction:column;font-family:"Literata",Georgia,serif;color:var(--txt);
}
.hud{
  position:absolute;top:0;left:0;right:0;z-index:6;padding:10px 13px 9px;
  background:linear-gradient(180deg,rgba(24,16,8,.5),rgba(24,16,8,0));
  display:flex;flex-direction:column;gap:5px;
}
.hud-top{display:flex;justify-content:space-between;align-items:center;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pips{display:flex;gap:3px;align-items:center}
.pip{width:6px;height:6px;border-radius:2px;background:#FF8A5C;box-shadow:0 1px 2px rgba(0,0,0,.4);flex:0 0 auto}
.pips.tight .pip{width:4px;height:4px;border-radius:1px}
.pips.tight{gap:2px}
.pip.spent{background:rgba(255,255,255,.24)}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.26);overflow:hidden}
.bar i{display:block;height:100%;width:10%;border-radius:4px;background:linear-gradient(90deg,#3FCF9E,#8CF0C9);transition:width .5s cubic-bezier(.3,.9,.3,1)}

.stage{position:relative;flex:0 0 auto;aspect-ratio:360/210;overflow:hidden;background:#F0D9B5}
.stage svg{display:block;width:100%;height:100%}
.stage.shake{animation:shk .4s ease}
.stage.bigshake{animation:shk .5s ease 2}
#door-panel{transition:transform .45s steps(3,end)}
#shaft-light{transition:opacity .4s steps(2,end)}
.whiteout{position:absolute;inset:0;background:#FFF8E1;opacity:0;pointer-events:none;z-index:8}
.whiteout.on{animation:wo .34s steps(2,end)}
@keyframes wo{0%{opacity:.95}60%{opacity:.35}100%{opacity:0}}
.vign{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;transition:opacity .8s ease;
  background:radial-gradient(ellipse at 42% 78%,rgba(0,0,0,0) 30%,rgba(0,0,0,.72) 100%)}
.vign.on{opacity:1}
.sndbtn{
  font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(0,0,0,.32);color:#fff;border:1px solid rgba(255,255,255,.35);
  border-radius:20px;padding:2px 8px;cursor:pointer;line-height:1.5;
}
.sndbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
#gang{transition:transform .6s cubic-bezier(.34,1.2,.5,1)}
#riz{transition:transform .5s ease}
.item{opacity:0;transform:translateY(-8px);transition:opacity .4s ease,transform .4s cubic-bezier(.3,1.4,.5,1)}
.item.on{opacity:1;transform:translateY(0)}
.hide{display:none}
#steam{opacity:0;transition:opacity .4s ease}
.toast{
  position:absolute;left:50%;top:38%;transform:translateX(-50%);z-index:7;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;letter-spacing:-.02em;
  color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);opacity:0;pointer-events:none;white-space:nowrap;
}
.toast.go{animation:pop 1s ease forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.85)}25%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.06)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-22px)}}

.turn{flex:1 1 auto;background:var(--panel);border-top:2px solid var(--panel-line);padding:13px 15px 15px;display:flex;flex-direction:column;gap:9px;min-height:0;position:relative;z-index:2}
.pal{display:flex;gap:9px;align-items:flex-start}
.pal-av{flex:0 0 28px;height:28px;border-radius:50%;background:var(--panel-2);border:1.5px solid var(--panel-line);display:grid;place-items:center;margin-top:1px;overflow:hidden}
.pal-line{font-size:15px;line-height:1.42;flex:1;min-width:0}
.pal-line .tr{color:var(--tr);font-weight:600;background:rgba(27,94,126,.09);padding:0 3px;border-radius:3px}
.prompt{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-soft);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.prompt .pts{color:var(--ok);font-weight:600}
.q{font-size:14.5px;font-weight:600;line-height:1.32;margin:-2px 0 0}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.chip{font-family:"Literata",Georgia,serif;font-size:14.5px;font-weight:600;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--panel-line);background:#fff;color:var(--txt);cursor:pointer;width:100%;transition:transform .12s ease,background .15s ease,border-color .15s ease,opacity .2s ease}
.chip:hover:not(:disabled){transform:translateY(-1px);border-color:var(--tr)}
.chip:focus-visible{outline:2px solid var(--tr);outline-offset:2px}
.chip:disabled{cursor:default}
.chip.right{background:#E4F5EC;border-color:var(--ok);color:var(--ok)}
.chip.wrong{background:#FBE6E0;border-color:var(--no);color:var(--no)}
.chip.gone{opacity:.25;text-decoration:line-through}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:24px}
.hintbtn{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:6px 9px;border-radius:7px;border:1.5px solid var(--panel-line);background:var(--panel-2);color:var(--txt-soft);cursor:pointer}
.hintbtn:disabled{opacity:.4;cursor:default}
.hintbtn:focus-visible{outline:2px solid var(--tr);outline-offset:2px}
.fb{font-size:12.5px;line-height:1.3;color:var(--txt-soft);flex:1;text-align:right}
.fb b{color:var(--ok)} .fb i{color:var(--no);font-style:normal}

.over{position:absolute;inset:0;z-index:20;display:none;place-items:center;padding:24px;background:rgba(20,14,8,.66);backdrop-filter:blur(3px)}
.over.on{display:grid}
.card{background:var(--panel);border-radius:18px;padding:20px 18px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.45);text-align:center}
.card h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:25px;letter-spacing:-.03em;margin:0 0 6px;line-height:1.05}
.card h3.win{color:var(--ok)} .card h3.lose{color:var(--no)}
.card p{margin:0 0 13px;font-size:14px;line-height:1.42;color:var(--txt-soft)}
.card .stats{display:flex;justify-content:center;gap:16px;margin:0 0 15px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-soft)}
.card .stats b{display:block;font-size:19px;color:var(--txt);letter-spacing:-.02em;font-weight:600}
.card button{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;padding:10px 18px;border-radius:11px;border:none;background:var(--tr);color:#fff;cursor:pointer;width:100%}
.card button.ghost{background:transparent;color:var(--txt-soft);border:1.5px solid var(--panel-line);margin-top:8px}
.card button:focus-visible{outline:2px solid var(--tr);outline-offset:2px}
.rescue-tag{position:absolute;top:48px;left:50%;transform:translateX(-50%);z-index:6;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;background:var(--no);color:#fff;padding:3px 9px;border-radius:20px;display:none}
.rescue-tag.on{display:block}

/* ---------- title screen ---------- */
.title{
  position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;
}
.title .scrim-top{flex:0 0 auto;aspect-ratio:360/210;background:linear-gradient(180deg,rgba(28,18,8,.10),rgba(24,15,6,.88))}
.title .scrim-body{flex:1 1 auto;background:#1B1206;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 30px}
.title.off{display:none}
.title .kicker{
  font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:#F2B535;margin-bottom:12px;
}
.title h2{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:30px;line-height:1.02;letter-spacing:-.03em;color:#FFF6E4;
  margin:0 0 12px;text-wrap:balance;
}
.title p{
  font-size:15px;line-height:1.45;color:#E4D5BE;margin:0 0 22px;max-width:30ch;
}
.title button{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;letter-spacing:-.01em;
  padding:14px 20px;border-radius:13px;border:none;width:100%;
  background:#F2B535;color:#2E2519;cursor:pointer;
  box-shadow:0 4px 0 #B8861F;transition:transform .1s ease,box-shadow .1s ease;
}
.title button:active{transform:translateY(3px);box-shadow:0 1px 0 #B8861F}
.title button:focus-visible{outline:2px solid #FFF6E4;outline-offset:3px}

@media(prefers-reduced-motion:reduce){
  #gang,#riz,.item,.bar i,#steam{transition:none}
  .stage.shake,.toast.go{animation:none}
  .toast.go{opacity:1}
}
</style>

<script>
(function(){
  "use strict";
  var T=function(s){return '<span class="tr">'+s+'</span>';};

  // ---- the level. `item` puts something on the counter. `fix` teaches the RULE,
  // ---- and `again` re-asks the same pattern with a different word.
  var LEVEL=[
    { type:"Comprehension", pts:1, atom:"ne istersiniz",
      pal:'Merhaba! '+T('Ne istersiniz?'),
      q:"What is Emre asking?",
      chips:["What would you like?","Where are you from?","How many people?"], ok:0,
      fix:T('istemek')+' is "to want". '+T('Ne istersiniz?')+' = what would you like?',
      again:{ q:'So what does '+T('Su ister misiniz?')+' mean?',
              chips:["Would you like water?","Is there water?","Water is finished."], ok:0 } },

    { type:"Completion", pts:2, atom:"lütfen", item:"cay",
      pal:'Start with tea. Ask me nicely.',
      q:'Bir çay, ______',
      chips:["lütfen","teşekkürler","evet"], ok:0,
      fix:'"Please" is '+T('lütfen')+' — it goes at the end.',
      again:{ q:'Now order a water the same way.',
              chips:["Bir su, evet","Bir su, lütfen","Lütfen bir su yok"], ok:1 } },

    { type:"Transformation", pts:2, atom:"X istiyorum", item:"su",
      pal:T('Çay istiyorum')+' means "I want tea". The water is '+T('su')+'.',
      q:"Say: I want water.",
      chips:["Su istiyorum","İstiyorum su","Su var mı"], ok:0,
      fix:'The thing comes first, then '+T('istiyorum')+'.',
      again:{ q:'Same shape, new word — you want bread ('+T('ekmek')+').',
              chips:["İstiyorum ekmek","Ekmek istiyorum","Ekmek lütfen"], ok:1 } },

    { type:"Comprehension", pts:1, atom:"var / yok",
      pal:'Small kitchen this morning. '+T('Çay var ama kahve yok.'),
      q:"What can't you have?",
      chips:["Coffee","Tea","Bread"], ok:0,
      fix:T('var')+' = there is. '+T('yok')+' = there isn\'t.',
      again:{ q:'So what does '+T('Börek var ama ekmek yok')+' tell you?',
              chips:["No börek","No bread","Nothing left"], ok:1 } },

    { type:"Situational", pts:3, atom:"var mı?", item:"seker",
      pal:'No sugar on your table. Sugar is '+T('şeker')+'.',
      q:"Ask me if there is any.",
      chips:["Şeker var mı?","Şeker yok.","Şeker istiyorum."], ok:0,
      fix:'To turn '+T('var')+' into a question, add '+T('mı')+' at the end.',
      again:{ q:'Try the same question about tea.',
              chips:["Çay mı var","Çay var mı?","Var mı çay"], ok:1 } },

    { type:"Completion", pts:2, atom:"var", item:"ekmek",
      pal:'I put a basket of warm bread down in front of you.',
      q:'Ekmek ______',
      chips:["var","yok","mı"], ok:0,
      fix:'It is right there, so '+T('var')+'. '+T('yok')+' would mean it\'s gone.',
      again:{ q:'The coffee machine is broken. Ekmek var, kahve ______',
              chips:["var","yok","mı"], ok:1 } },

    { type:"Comprehension", pts:1, atom:"başka bir şey",
      pal:'I lean over the counter. '+T('Başka bir şey?'),
      q:"What am I asking?",
      chips:["Anything else?","How much?","What's your name?"], ok:0,
      fix:T('başka')+' = other, '+T('şey')+' = thing.',
      again:{ q:'And '+T('başka bir çay?')+' would be —',
              chips:["No more tea?","Another tea?","Whose tea?"], ok:1 } },

    { type:"Transformation", pts:2, atom:"var mı?", item:"borek",
      pal:'The pastry is '+T('börek')+'. You know how to ask.',
      q:"Ask if they have börek.",
      chips:["Börek var mı?","Börek yok.","Börek lütfen."], ok:0,
      fix:'Same question frame every time: thing + '+T('var mı?'),
      again:{ q:'Now ask about sugar.',
              chips:["Şeker yok mu","Şeker var mı?","Var şeker mı"], ok:1 } },

    { type:"Situational", pts:2, atom:"iki",
      pal:T('Kaç tane?')+' — how many teas?',
      q:"Say two. (two = "+"iki)",
      chips:["İki çay","Bir çay","Çay iki"], ok:0,
      fix:'The number goes before the thing: '+T('iki çay')+'.',

              chips:["Ekmek üç","Üç ekmek","Üç ekmekler"], ok:1 } },

    { type:"Situational", pts:2, atom:"teşekkürler",
      pal:'I bag it all up and slide it across.',
      q:"Thank me.",
      chips:["Teşekkürler!","Lütfen!","Merhaba!"], ok:0,
      fix:T('lütfen')+' is please, '+T('teşekkürler')+' is thanks.',
      again:{ q:'And how would you greet me tomorrow?',
              chips:["Teşekkürler!","Merhaba!","Görüşürüz!"], ok:1 } },

    { type:"Completion", pts:2, atom:"hesap", item:"hesap",
      pal:'Time to pay. The bill is '+T('hesap')+'.',
      q:'Hesap, ______',
      chips:["lütfen","var","yok"], ok:0,
      fix:'Asking for something politely: thing + '+T('lütfen')+'.',
      again:{ q:'Ask for the menu the same way ('+T('menü')+').',
              chips:["Menü var","Menü, lütfen","Lütfen menü yok"], ok:1 } },

    { type:"Situational", pts:3, atom:"görüşürüz",
      pal:'That man has stood up. Time to go.',
      q:"Say goodbye — see you.",
      chips:["Görüşürüz!","Merhaba!","Lütfen!"], ok:0,
      fix:T('merhaba')+' opens, '+T('görüşürüz')+' closes.',
      again:{ q:'And which one do you say walking IN?',
              chips:["Görüşürüz!","Merhaba!","Teşekkürler!"], ok:1 } }
  ];

  // Level config. Tuned so ~70% first-try accuracy finishes the order just as he
  // arrives. soft:true swaps the shooting for him snatching the bag and storming out.
  var CFG={ goal:20, patience:16, start:2, soft:false };

  var el=function(id){return document.getElementById(id);};
  var stage=el('stage'), gang=el('gang'), riz=el('riz'), toast=el('toast'),
      palLine=el('pal-line'), pType=el('p-type'), pPts=el('p-pts'), pQ=el('p-q'),
      chipBox=el('chips'), hintBtn=el('hint'), fb=el('fb'), bar=el('hud-bar'),
      pips=el('hud-pips'), over=el('over'), ovH=el('ov-h'), ovP=el('ov-p'),
      ovStats=el('ov-stats'), ovA=el('ov-a'), ovB=el('ov-b'),
      rescueTag=el('rescue-tag'), hudScene=el('hud-scene'), steam=el('steam'),
      gMouth=el('g-mouth'), gun=el('gun'), flash=el('flash'), tray=el('tray'), blood=el('blood'),
      smoke=el('smoke'), doorPanel=el('door-panel'), shaftLight=el('shaft-light'),
      whiteout=el('whiteout'), vign=el('vign'), sndBtn=el('snd'),
      armL=el('riz-armL'), armR=el('riz-armR'), legF=el('riz-legF'), legB=el('riz-legB'),
      gArmR=el('g-armR'), gFistR=el('g-fistR'), bulge=el('bulge'), grip=el('grip'),
      flowers=el('flowers'), sparkle=el('sparkle');
  var skins=document.querySelectorAll('#gang .skin');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S={};

  // ---------------------------------------------------------------
  // lo-fi bleeper: square waves and filtered noise, no files, no libs
  // ---------------------------------------------------------------
  var AC=null, muted=false;
  function ac(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(AC.state==='suspended'){ AC.resume(); }
    return AC;
  }
  function tone(freq,delay,dur,type,vol,glideTo){
    var c=ac(); if(!c||muted) return;
    var t=c.currentTime+delay;
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq,t);
    if(glideTo){ o.frequency.exponentialRampToValueAtTime(Math.max(30,glideTo),t+dur); }
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(delay,dur,vol,cut,cutTo){
    var c=ac(); if(!c||muted) return;
    var t=c.currentTime+delay, n=Math.floor(c.sampleRate*dur);
    var buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
    var src=c.createBufferSource(); src.buffer=buf;
    var f=c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(cut||1200,t);
    if(cutTo){ f.frequency.exponentialRampToValueAtTime(Math.max(60,cutTo),t+dur); }
    var g=c.createGain(); g.gain.setValueAtTime(vol||0.2,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(t); src.stop(t+dur);
  }
  var sfx={
    right:function(){ tone(660,0,.07); tone(990,.07,.10); },
    wrong:function(){ tone(200,0,.16,'sawtooth',.12,120); },
    surge:function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,i*.055,.09); }); },
    step:function(){ noise(0,.06,.14,340); tone(84,0,.09,'triangle',.10); },
    hint:function(){ tone(880,0,.05,'triangle',.09); },
    door:function(){ tone(988,0,.08,'triangle',.10); tone(1319,.09,.16,'triangle',.09); },
    walk:function(){ noise(0,.05,.10,500); },
    win:function(){ [523,659,784,1046,1318].forEach(function(f,i){ tone(f,i*.09,.13,'square',.13); });
                    tone(1568,.46,.34,'triangle',.10); },
    click:function(){ tone(1400,0,.02,'square',.08); tone(700,.03,.03,'square',.07); },
    shot:function(){ noise(0,.30,.42,5000,140); tone(150,0,.26,'sine',.30,38);
                     tone(70,.06,.30,'triangle',.18,30); },
    dirge:function(){ [392,349,294,196].forEach(function(f,i){ tone(f,.55+i*.20,.26,'triangle',.13); }); },
    rustle:function(){ noise(0,.10,.16,2200,700); },
    slam:function(){ noise(0,.16,.34,700,90); tone(60,.02,.20,'triangle',.20,34); },
    grumble:function(){ tone(120,0,.30,'sawtooth',.10,80); },
    dread:function(){ tone(110,0,.34,'sawtooth',.12,72); },
    heart:function(){ tone(58,0,.13,'sine',.26,44); tone(52,.19,.16,'sine',.20,38); },
    bloom:function(){ [659,880,1046,1318].forEach(function(f,i){ tone(f,i*.07,.22,'triangle',.13); });
                      tone(1760,.30,.30,'triangle',.08); }
  };
  sndBtn.addEventListener('click',function(){
    muted=!muted;
    sndBtn.textContent=muted?'Muted':'Sfx';
    sndBtn.setAttribute('aria-pressed',String(!muted));
    if(!muted) sfx.click();
  });

  // crude frame sequencer: [[ms, fn], ...]
  function seq(steps){
    var scale=reduce?0.25:1;
    steps.forEach(function(st){ setTimeout(st[1], st[0]*scale); });
    return steps[steps.length-1][0]*scale;
  }

  function lerp(a,b,t){return a+(b-a)*t;}
  function mix(c1,c2,t){
    var r=Math.round(lerp(c1[0],c2[0],t)),g=Math.round(lerp(c1[1],c2[1],t)),b=Math.round(lerp(c1[2],c2[2],t));
    return 'rgb('+r+','+g+','+b+')';
  }

  // How close his hand is to whatever is in that coat. Four stages, snapped
  // rather than tweened — the loss is telegraphed three turns before it lands.
  var ARM=[
    { d:'M35 32 q 9 12 6 26',  fist:[41,58], fistOn:1, bulge:0, grip:0 },
    { d:'M35 32 q 8 10 2 20',  fist:[37,52], fistOn:1, bulge:0, grip:0 },
    { d:'M35 32 q 6 8 -3 14',  fist:[32,46], fistOn:0, bulge:1, grip:0 },
    { d:'M35 32 q 4 6 -4 12',  fist:[31,44], fistOn:0, bulge:1, grip:1 }
  ];
  function armStage(f){ return f>=0.86?3 : f>=0.62?2 : f>=0.38?1 : 0; }
  function setArm(n){
    var a=ARM[n];
    gArmR.setAttribute('d',a.d);
    gFistR.setAttribute('cx',a.fist[0]); gFistR.setAttribute('cy',a.fist[1]);
    gFistR.setAttribute('opacity',a.fistOn?'1':'0');
    bulge.classList.toggle('hide',!a.bulge);
    grip.classList.toggle('hide',!a.grip);
  }

  function paint(){
    var f=Math.min(S.pressure/S.patience,1);
    if(!S.done){
      var st=armStage(f);
      if(st!==S.armStage){
        setArm(st);
        if(st===2){ noise(.15,.14,.13,900,300); }        // coat shifting
        if(st===3){ sfx.click(); }                        // something metal
        S.armStage=st;
      }
    }
    gang.setAttribute('transform','translate('+(f*66).toFixed(1)+',0) scale('+(1+f*0.12).toFixed(3)+') translate(0,'+(-f*9).toFixed(1)+')');
    var col=mix([201,141,90],[214,45,28],f);
    for(var i=0;i<skins.length;i++){ skins[i].setAttribute('fill',col); }
    steam.style.opacity=f<0.34?0:((f-0.34)/0.66).toFixed(2);
    gMouth.setAttribute('d', f<0.5 ? 'M20 28 q 4 2 8 0' : 'M19 29 q 5 -4 10 0');
    bar.style.width=(Math.min(S.p/S.goal,1)*100).toFixed(1)+'%';
    var s='';
    for(var k=0;k<S.patience;k++){ s+='<i class="pip'+(k<S.pressure?' spent':'')+'"></i>'; }
    pips.className='pips'+(S.patience>18?' tight':'');
    pips.innerHTML=s;
  }

  function showItem(key){
    var n=document.querySelector('#items .item[data-k="'+key+'"]');
    if(n) n.classList.add('on');
  }
  function clearItems(){
    var ns=document.querySelectorAll('#items .item');
    for(var i=0;i<ns.length;i++){ ns[i].classList.remove('on'); }
  }
  function flashMsg(t){ toast.textContent=t; toast.classList.remove('go'); void toast.offsetWidth; toast.classList.add('go'); }
  function shake(){ if(reduce) return; stage.classList.add('shake'); setTimeout(function(){stage.classList.remove('shake');},400); }

  function shuffled(turn){
    var idx=turn.chips.map(function(_,i){return i;});
    for(var i=idx.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    return { labels: idx.map(function(i){return turn.chips[i];}), ok: idx.indexOf(turn.ok) };
  }

  function renderTurn(){
    var turn=S.queue[S.i];
    S.hinted=false; S.locked=false;
    hintBtn.disabled=false; hintBtn.textContent='Hint · costs half';
    fb.innerHTML='';
    palLine.innerHTML=turn.pal;
    pType.textContent=turn.type;
    pPts.textContent='+'+turn.pts;
    pQ.innerHTML=turn.q;
    var sh=shuffled(turn);
    S.okIdx=sh.ok;
    chipBox.innerHTML='';
    sh.labels.forEach(function(label,idx){
      var b=document.createElement('button');
      b.className='chip'; b.type='button'; b.textContent=label;
      b.addEventListener('click',function(){ answer(idx); });
      chipBox.appendChild(b);
    });
  }

  function answer(idx){
    if(S.locked||S.done) return;
    S.locked=true; hintBtn.disabled=true;
    var turn=S.queue[S.i];
    var nodes=chipBox.querySelectorAll('.chip');
    for(var k=0;k<nodes.length;k++){ nodes[k].disabled=true; }
    var right=idx===S.okIdx;
    var gain=right?(S.hinted?Math.max(1,Math.floor(turn.pts/2)):turn.pts):0;

    if(right){
      nodes[idx].classList.add('right');
      S.streak++; S.p+=gain;
      var surge=false;
      if(S.streak>0 && S.streak%3===0){ S.p+=1; S.pressure=Math.max(0,S.pressure-1); surge=true; }
      if(turn.item) showItem(turn.item);
      S.pressure+=1;
      fb.innerHTML='<b>+'+(gain+(surge?1:0))+'</b>'+(surge?' · he holds back':' · doğru');
      flashMsg(surge?'SURGE +'+(gain+1):'+'+gain);
      if(surge){ sfx.surge(); shake(); } else { sfx.right(); setTimeout(sfx.step,180); }
    } else {
      nodes[idx].classList.add('wrong');
      nodes[S.okIdx].classList.add('right');
      S.streak=0; S.missed.push(turn);
      S.pressure+=2;
      fb.innerHTML='<i>0</i> · he takes two steps';
      flashMsg('YANLIŞ');
      sfx.wrong(); setTimeout(sfx.step,200); setTimeout(sfx.step,380);
      shake();
      if(!turn.isRepair && turn.again){
        S.queue.splice(S.i+1,0,{
          type:"Repair", pts:1, atom:turn.atom, isRepair:true,
          pal:turn.fix, q:turn.again.q, chips:turn.again.chips, ok:turn.again.ok
        });
      }
    }
    S.t++;
    paint();

    if(S.p>=S.goal){ setTimeout(winSequence,700); return; }
    if(S.pressure>=S.patience || S.i>=S.queue.length-1){ setTimeout(loseSequence,700); return; }
    setTimeout(function(){ S.i++; renderTurn(); },950);
  }

  hintBtn.addEventListener('click',function(){
    if(S.locked||S.hinted) return;
    S.hinted=true; hintBtn.disabled=true; hintBtn.textContent='Hint used';
    var nodes=chipBox.querySelectorAll('.chip');
    for(var k=0;k<nodes.length;k++){
      if(k!==S.okIdx && !nodes[k].classList.contains('gone')){
        nodes[k].classList.add('gone'); nodes[k].disabled=true; break;
      }
    }
    fb.innerHTML='Half points now.';
    sfx.hint();
  });

  function rizAt(x,y,rot){
    riz.setAttribute('transform','translate('+x+','+(y||0)+')'+(rot?' rotate('+rot+' 160 176)':''));
    tray.setAttribute('transform','translate('+x+','+(y||0)+')');
  }
  function stride(n){            // crude 2-frame walk: swap the legs, bob the body
    if(n%2){ legF.setAttribute('d','M13 62 h10 v18 h-10 z'); legB.setAttribute('d','M27 62 h10 v18 h-10 z'); }
    else   { legF.setAttribute('d','M11 62 h10 v18 h-10 z'); legB.setAttribute('d','M25 62 h10 v18 h-10 z'); }
  }

  function winSequence(){
    S.done=true;
    seq([
      // 1 — Emre bags the order up and Riz takes it
      [0,   function(){ sfx.rustle(); armR.setAttribute('d','M34 38 q 12 0 16 6'); }],
      [260, function(){ sfx.rustle(); clearItems(); tray.classList.remove('hide'); }],
      [520, function(){ sfx.right(); armL.setAttribute('d','M14 38 q -6 -4 -9 -2'); }],

      // 2 — the man from the corner table arrives, hand in his coat
      [820, function(){ sfx.dread();
                        gang.setAttribute('transform','translate(44,0) scale(1.1) translate(0,-8)');
                        bulge.classList.remove('hide'); grip.classList.add('hide');
                        gArmR.setAttribute('d','M35 32 q 6 8 -3 14');
                        gFistR.setAttribute('opacity','0'); }],

      // 3 — and then he just stands there. a full second of it.
      [1150,function(){ sfx.heart(); }],
      [1520,function(){ sfx.heart(); }],

      // 4 — flowers.
      [1850,function(){ sfx.bloom();
                        bulge.classList.add('hide'); grip.classList.add('hide');
                        gArmR.setAttribute('d','M35 32 q 11 6 12 17');
                        gFistR.setAttribute('cx','47'); gFistR.setAttribute('cy','50');
                        gFistR.setAttribute('opacity','1');
                        flowers.classList.remove('hide');
                        steam.style.opacity=0; sparkle.classList.remove('hide');
                        for(var i=0;i<skins.length;i++){ skins[i].setAttribute('fill','rgb(201,141,90)'); }
                        gMouth.setAttribute('d','M18 27 q 6 6 12 0');
                        flashMsg('ÇİÇEKLER!'); }],

      // 5 — let it land before anybody moves
      [2350,function(){ armL.setAttribute('d','M14 38 q -10 -2 -12 -8'); }],   // Riz takes them
      [2650,function(){ sfx.right(); flashMsg('TEŞEKKÜRLER!'); }],

      // 6 — out into the morning
      [3200,function(){ stride(1); rizAt(34,-2); sfx.walk(); }],
      [3400,function(){ stride(2); rizAt(70,0);  sfx.walk(); }],
      [3600,function(){ stride(3); rizAt(108,-2);sfx.walk(); }],
      [3800,function(){ stride(4); rizAt(146,0); sfx.walk(); }],
      [3960,function(){ sfx.door(); doorPanel.setAttribute('transform','translate(30,0) scale(.6,1)');
                        shaftLight.setAttribute('opacity','.6'); }],
      [4100,function(){ stride(5); rizAt(184,-2); sfx.walk(); flashMsg('GÖRÜŞÜRÜZ!'); }],
      [4300,function(){ riz.style.transition='transform .5s steps(3,end),opacity .4s steps(2,end)';
                        rizAt(214,0); riz.style.opacity='0'; tray.style.opacity='0'; }],
      [4640,function(){ sfx.win(); doorPanel.setAttribute('transform','translate(0,0)');
                        shaftLight.setAttribute('opacity','0'); }],
      [5100,function(){ finish(true); }]
    ]);
  }

  function shotSequence(){
    seq([
      // 1 — he arrives and squares up, hand still inside the coat
      [0,   function(){ sfx.dread();
                        gang.setAttribute('transform','translate(70,0) scale(1.14) translate(0,-10)');
                        bulge.classList.remove('hide'); grip.classList.add('hide');
                        flowers.classList.add('hide');
                        gArmR.setAttribute('d','M35 32 q 6 8 -3 14');
                        gFistR.setAttribute('opacity','0');
                        gMouth.setAttribute('d','M19 29 q 5 -4 10 0'); }],

      // 2 — the same second of nothing
      [420, function(){ sfx.heart(); }],
      [790, function(){ sfx.heart(); }],

      // 3 — the hand comes out
      [1100,function(){ noise(0,.16,.15,900,300);
                        bulge.classList.add('hide');
                        gArmR.setAttribute('d','M35 32 q 6 8 4 18');
                        gFistR.setAttribute('cx','39'); gFistR.setAttribute('cy','50');
                        gFistR.setAttribute('opacity','1'); }],
      [1350,function(){ sfx.click(); gun.classList.remove('hide');
                        gArmR.setAttribute('d','M35 32 q 8 6 8 22');
                        gFistR.setAttribute('cx','41'); gFistR.setAttribute('cy','56');
                        gMouth.setAttribute('d','M18 30 q 6 -6 12 0'); }],

      // 4 — bang
      [1750,function(){ sfx.shot(); flash.classList.remove('hide');
                        whiteout.classList.add('on'); flashMsg('BANG!');
                        stage.classList.add('bigshake');
                        rizAt(-10,0); }],
      [1970,function(){ flash.classList.add('hide'); whiteout.classList.remove('on');
                        stage.classList.remove('bigshake'); }],

      // 5 — and he stays upright for a moment, which is the funniest part
      [2200,function(){ riz.style.transition='transform .22s steps(2,end)'; rizAt(-12,2,-8); }],
      [2450,function(){ rizAt(-9,3,4); }],

      // 6 — timber
      [2700,function(){ riz.style.transition='transform .18s steps(2,end)'; rizAt(-14,22,-34); }],
      [2960,function(){ rizAt(-18,54,-76); noise(0,.12,.22,420); }],
      [3140,function(){ blood.innerHTML=''; blood.classList.remove('hide'); splat(4); }],
      [3300,function(){ splat(4); }],
      [3480,function(){ splat(5); sfx.dirge(); }],
      [3680,function(){ smoke.classList.remove('hide'); vign.classList.add('on'); }],
      [4600,function(){ finish(false); }]
    ]);
  }

  function splat(n){
    var px=blood.innerHTML;
    for(var i=0;i<n;i++){
      var x=112+Math.round(Math.random()*10)*5, y=174+Math.round(Math.random()*4)*5;
      px+='<rect x="'+x+'" y="'+y+'" width="5" height="5" fill="'+(i%3?'#A81E14':'#7C120B')+'"/>';
    }
    blood.innerHTML=px;
  }

  function snatchSequence(){
    var keys=['cay','su','seker','ekmek','borek','hesap'], steps=[];
    steps.push([0, function(){ sfx.dread();
      gang.setAttribute('transform','translate(74,0) scale(1.14) translate(0,-10)');
      bulge.classList.remove('hide'); grip.classList.add('hide');
      gArmR.setAttribute('d','M35 32 q 6 8 -3 14'); gFistR.setAttribute('opacity','0');
      gMouth.setAttribute('d','M18 30 q 6 -6 12 0'); }]);
    steps.push([420, function(){ sfx.heart(); }]);
    steps.push([790, function(){ sfx.heart(); }]);
    steps.push([1150, function(){ sfx.grumble(); bulge.classList.add('hide'); grip.classList.add('hide');
      gArmR.setAttribute('d','M35 32 q 14 2 22 4');
      gFistR.setAttribute('cx','57'); gFistR.setAttribute('cy','36');
      gFistR.setAttribute('opacity','1');
      flashMsg('HEY!'); shake(); }]);
    keys.forEach(function(k,i){
      steps.push([1730+i*110, function(){
        var n=document.querySelector('#items .item[data-k="'+k+'"]');
        if(n && n.classList.contains('on')){ n.classList.remove('on'); sfx.rustle(); }
      }]);
    });
    steps.push([2450, function(){ gArmR.setAttribute('d','M35 32 q 9 12 6 26');
      gFistR.setAttribute('cx','41'); gFistR.setAttribute('cy','58');
      armL.setAttribute('d','M14 38 q -6 10 -7 16'); armR.setAttribute('d','M34 38 q 6 10 7 16');
      rizAt(0,4); }]);
    steps.push([2630, function(){ gang.setAttribute('transform','translate(-40,0) scale(1.1)'); sfx.walk(); }]);
    steps.push([2880, function(){ gang.setAttribute('transform','translate(-120,0) scale(1.05)'); sfx.walk(); }]);
    steps.push([3130, function(){ sfx.slam(); shake(); vign.classList.add('on'); }]);
    steps.push([3900, function(){ finish(false); }]);
    seq(steps);
  }

  function loseSequence(){
    S.done=true;
    if(CFG.soft){ snatchSequence(); } else { shotSequence(); }
  }

  function finish(won){
    var uniq={}, list=[];
    S.missed.forEach(function(m){ if(!uniq[m.atom]){uniq[m.atom]=1;list.push(m.atom);} });
    ovStats.innerHTML='<div>Order<b>'+Math.min(S.p,S.goal)+'/'+S.goal+'</b></div>'+
      '<div>Patience<b>'+Math.min(S.pressure,S.patience)+'/'+S.patience+'</b></div>'+
      '<div>Missed<b>'+list.length+'</b></div>';
    if(won){
      ovH.textContent='Out the door.'; ovH.className='win';
      ovP.innerHTML='Full order, paid up — and it turns out he was reaching for flowers all along.'+
        (list.length?' Shaky on: <b>'+list.join(', ')+'</b> — those come back next session.':' Nothing missed.');
      ovA.textContent='Play again'; ovA.onclick=function(){ start(LEVEL,false); };
    } else {
      ovH.textContent = CFG.soft ? 'He takes the bag.' : 'He shoots.';
      ovH.className='lose';
      ovP.innerHTML=list.length
        ? 'Go again with only the words that tripped you: <b>'+list.join(', ')+'</b>.'
        : 'You ran out of turns before the order was done.';
      ovA.textContent=list.length?'Second chance':'Try again';
      ovA.onclick=function(){ if(list.length){ start(S.missed.slice(),true); } else { start(LEVEL,false); } };
    }
    over.classList.add('on');
  }

  ovB.onclick=function(){ start(LEVEL,false); el('title').classList.remove('off'); };
  el('play').addEventListener('click',function(){
    sfx.click();                      // doubles as the gesture browsers need before audio
    el('title').classList.add('off');
  });

  function start(turns,rescue){
    var GOAL=CFG.goal, PAT=CFG.patience, ST=CFG.start;
    var seen={}, q=[];
    turns.forEach(function(t){ if(!seen[t.q]){seen[t.q]=1;q.push(t);} });
    S={ queue:q.map(function(o){var c={};for(var k in o){c[k]=o[k];}c.isRepair=false;return c;}),
        i:0, p:ST, t:0, pressure:0, streak:0, missed:[], done:false, locked:false, hinted:false, okIdx:0,
        goal: rescue?Math.min(GOAL,ST+q.reduce(function(a,b){return a+b.pts;},0)):GOAL,
        patience: rescue?Math.max(6,q.length*2+2):PAT };
    riz.style.opacity='1'; riz.style.transition='transform .5s steps(2,end)';
    riz.setAttribute('transform','translate(0,0)');
    tray.classList.add('hide'); tray.style.opacity='1'; tray.setAttribute('transform','translate(0,0)');
    gun.classList.add('hide'); flash.classList.add('hide'); blood.classList.add('hide');
    smoke.classList.add('hide'); blood.innerHTML='';
    vign.classList.remove('on'); whiteout.classList.remove('on');
    doorPanel.setAttribute('transform','translate(0,0)'); shaftLight.setAttribute('opacity','0');
    armL.setAttribute('d','M14 38 q -8 6 -9 18'); armR.setAttribute('d','M34 38 q 8 6 9 18');
    legF.setAttribute('d','M13 62 h10 v18 h-10 z'); legB.setAttribute('d','M25 62 h10 v18 h-10 z');
    S.armStage=0; setArm(0);
    flowers.classList.add('hide'); sparkle.classList.add('hide');
    gMouth.setAttribute('d','M20 28 q 4 2 8 0');
    clearItems();
    rescueTag.classList.toggle('on',!!rescue);
    hudScene.textContent=rescue?'Second chance':'Kadıköy · L1';
    over.classList.remove('on');
    paint(); renderTurn();
  }

  start(LEVEL,false);
})();
</script>
